<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Mis finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">L</span>
      <div class="brand-text">
        <strong>Ledger</strong>
        <small>rumbo a cero deudas</small>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-view="dashboard">
        <span class="nav-num">01</span> Panorama
      </button>
      <button class="nav-item" data-view="cuentas">
        <span class="nav-num">02</span> Cuentas
      </button>
      <button class="nav-item" data-view="tarjetas">
        <span class="nav-num">03</span> Tarjetas
      </button>
      <button class="nav-item" data-view="efectivo">
        <span class="nav-num">04</span> Efectivo
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="net-label">Patrimonio neto</div>
      <div class="net-value" id="sidebarNet">Q0.00</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="viewTitle">Panorama general</h1>
      <div class="topbar-date" id="todayDate"></div>
    </header>

    <section id="view-dashboard" class="view"></section>
    <section id="view-cuentas" class="view" hidden></section>
    <section id="view-tarjetas" class="view" hidden></section>
    <section id="view-efectivo" class="view" hidden></section>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script src="/js/app.js"></script>
</body>
</html>
